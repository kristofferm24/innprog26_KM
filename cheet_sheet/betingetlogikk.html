<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for betinget logikk</title>
</head>
<body>
    <p id="loginStatus">Ikke logget inn</p>

    <script>
        const username = "kristoffer"
        const password = "passord123"
        let loggedIn = false

        //IF-test som sjekker om innsendt brukernavn matcher systemet:
        if(username === "kristoffer") {
            console.log("Brukernavn er riktig")
        } else {
            console.log("Feil brukernavn")
        } 

        //IF-test som sjekker om burkernavn og passord er riktig, og gjør klar login:
        if(username === "kristoffer" && password === "passord123") {
            loggedIn = true
            console.log(loggedIn)
        }
    </script>
</body>
</html>
